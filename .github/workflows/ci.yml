# Tests y lint en cada PR y en cada push a main. Render despliega solo si esto pasa (ADR-0009).
name: CI

# El workflow solo lee el repo
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: statsline_test
          MYSQL_USER: statsline
          MYSQL_PASSWORD: statsline
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DATABASE_URL: mysql+pymysql://statsline:statsline@127.0.0.1:3306/statsline_test
      DATABASE_URL_TEST: mysql+pymysql://statsline:statsline@127.0.0.1:3306/statsline_test
      SECRET_KEY: clave-solo-para-el-ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=app --cov=semillas

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build

  imagen:
    # Construye el Dockerfile que usa Render y lo levanta contra un MySQL limpio
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: statsline
          MYSQL_USER: statsline
          MYSQL_PASSWORD: statsline
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t statsline .
      - name: Levantar la imagen
        run: |
          docker run -d --name statsline --network host \
            -e PORT=8000 \
            -e DATABASE_URL=mysql://statsline:statsline@127.0.0.1:3306/statsline \
            -e SECRET_KEY=clave-solo-para-el-ci-de-mas-de-32-caracteres \
            -e DEMO_CONTRASENA=contrasena-del-ci \
            statsline
      - name: /api/v1/salud responde ok y la home se sirve
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/salud; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/salud | grep -q '"base_de_datos":"ok"'
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8000/buscar | grep -q '<div id="root">'
      - name: Logs del contenedor
        if: always()
        run: docker logs statsline
