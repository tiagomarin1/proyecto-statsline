[project]
name = "backend"
version = "0.1.0"
description = "API de StatsLine: FastAPI + MySQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1.1",
    "cryptography>=43",  # PyMySQL la necesita para el login caching_sha2_password de MySQL 8
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2.1",
    "pyjwt>=2.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "semillas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integracion: necesita la base MySQL de test (DATABASE_URL_TEST)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI usa Depends(), Cookie(), etc. como valores por defecto
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query"]
