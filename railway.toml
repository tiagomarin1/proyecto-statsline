# Servicio "web" de Railway (ADR-0006). Las variables de entorno se cargan en el panel.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["sh -c \"alembic upgrade head && python -m semillas\""]
healthcheckPath = "/api/v1/salud"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
