# PostgreSQL 16 para desarrollo (statsline_dev) y para tests (statsline_test). ADR-0010.
#   docker compose up -d postgres
# La base de test la crea docker/postgres/01-bases.sql la primera vez que arranca el volumen.
services:
  postgres:
    image: postgres:16
    container_name: statsline-postgres
    environment:
      POSTGRES_DB: statsline_dev
      POSTGRES_USER: statsline
      POSTGRES_PASSWORD: statsline
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "statsline", "-d", "statsline_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-datos:
